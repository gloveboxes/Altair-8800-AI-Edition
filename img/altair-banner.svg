<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title description">
  <title id="title">Altair 8800 Z80 AI Edition</title>
  <desc id="description">Altair 8800 Z80 AI Edition. A Z80 emulated on the ESP32-S3, with CP/M, BASIC, C and a front-panel experience. Also runs on desktop platforms and Docker. A Z80 chip icon sits inside an ESP32-S3 outline labelled Emulated Z80.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102237"/>
      <stop offset="1" stop-color="#183c4c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#75bdb9" opacity=".13"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#68ddcf"/>
    </marker>
  </defs>
  <rect width="1440" height="400" rx="24" fill="url(#background)"/>
  <rect width="1440" height="400" rx="24" fill="url(#grid)"/>
  <path d="M0 376h1440" stroke="#41cfbd" stroke-width="3" opacity=".55"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="83" fill="#68ddcf" font-size="17" font-weight="700" letter-spacing="3.5">CLASSIC COMPUTING. MODERN HARDWARE.</text>
    <text x="60" y="167" fill="#fff" font-size="62" font-weight="700" letter-spacing="-2">Altair <tspan fill="#68ddcf">8800</tspan></text>
    <text x="378" y="164" fill="#b8d0df" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2">Z80 AI EDITION</text>
    <text x="64" y="224" fill="#d2e3ed" font-size="28">Retro computing with AI.</text>
    <path d="M64 263h626" stroke="#557d8d"/>
    <text x="64" y="300" fill="#b8d0df" font-size="21">CP/M · BASIC · C · Front-panel experience</text>
    <text x="64" y="342" fill="#8cacbe" font-size="18">ESP32-S3 · Linux · macOS · Windows · Docker</text>
    <!-- The chip mark represents software emulation on the ESP32-S3. -->
    <rect x="855" y="73" width="500" height="254" rx="20" fill="#102237" stroke="#557d8d" stroke-width="2"/>
    <text x="1105" y="111" text-anchor="middle" fill="#b8d0df" font-size="20" letter-spacing="3">ESP32-S3</text>
    <g transform="translate(1025 120)">
  <rect x="24" y="24" width="112" height="112" rx="22" fill="#172c46"/>
  <g fill="none" stroke="#008f87" stroke-width="8" stroke-linecap="round">
    <path d="M8 52h16M8 80h16M8 108h16M136 52h16M136 80h16M136 108h16M52 8v16M80 8v16M108 8v16M52 136v16M80 136v16M108 136v16"/>
  </g>
  <text x="80" y="86" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-2">Z80</text>
  <path d="M44 109h17V97h18v12h18V97h19" fill="none" stroke="#5ce0cd" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <text x="1105" y="308" text-anchor="middle" fill="#68ddcf" font-size="19" font-weight="700" letter-spacing="2">EMULATED Z80</text>
    <g fill="#68ddcf" opacity=".8">
      <circle cx="900" cy="156" r="5"/><circle cx="922" cy="156" r="5"/><circle cx="944" cy="156" r="5"/>
      <circle cx="1266" cy="156" r="5"/><circle cx="1288" cy="156" r="5"/><circle cx="1310" cy="156" r="5"/>
    </g>
    <path d="M898 239h50m-50 16h50m314-16h50m-50 16h50" stroke="#557d8d" stroke-width="3"/>
  </g>
</svg>
